<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Spam Classifier</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    textarea {
      width: 100%;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: vertical;
      font-size: 1rem;
      outline: none;
      transition: border 0.3s;
    }

    textarea:focus {
      border-color: #0077cc;
    }

    button {
      margin-top: 20px;
      padding: 12px 30px;
      font-size: 1rem;
      color: #fff;
      background-color: #0077cc;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #005fa3;
    }

    .result {
      margin-top: 20px;
      font-size: 1.2rem;
      color: #333;
      font-weight: bold;
    }

    .reset-link {
      display: block;
      margin-top: 15px;
      text-decoration: none;
      color: #0077cc;
    }

    .reset-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Email Spam Classifier</h1>
    <form action='/predict' method="post">
      <div>
        <textarea name="email_body" placeholder="Paste the body of the email here..." rows="10" cols="40" required>{{text}}</textarea>
      </div>
      <div>
        <button type="submit">Check Spam</button>
      </div>
      <a class="reset-link" href="/">Reset</a>
    </form>
    
    {% if predictions %}
    <div class="result">
      Result: {{ predictions }}
    </div>
    {% endif %}
  </div>
</body>
</html>
